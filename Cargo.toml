[workspace]
members = ["crates/graduate", "crates/graduate-cli"]
default-members = ["crates/graduate-cli"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Trevor Ramey", "Graduate contributors"]
repository = "https://github.com/treramey/graduate"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
