[package]
name = "graduate-cli"
description = "Graduate, a Jira Cloud command-line and terminal client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
setup-ui-fixture = []

[[bin]]
name = "gd"
path = "src/main.rs"

[dependencies]
clap.workspace = true
cap-std = "4"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6.0"
futures-util = "0.3"
fs2 = "0.4"
getrandom = "0.4"
gix = { version = "0.86", default-features = false, features = ["max-performance-safe", "revision", "sha1"] }
graduate = { version = "1.4.1", path = "../graduate" }
hmac = "0.12"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.20"
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tui-input = { version = "0.15", default-features = false, features = ["crossterm"] }
url.workspace = true
webbrowser = { version = "1.2", features = ["hardened"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[target.'cfg(windows)'.dependencies]
atomicwrites = "0.4"

[lints]
workspace = true
