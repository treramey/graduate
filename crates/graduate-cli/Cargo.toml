[package]
name = "graduate-cli"
description = "Graduate, a Jira Cloud command-line and terminal client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "gd"
path = "src/main.rs"

[dependencies]
clap.workspace = true
cap-std = "4"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6.0"
futures-util = "0.3"
fs2 = "0.4"
gix = { version = "0.86", default-features = false, features = ["max-performance-safe", "revision", "sha1"] }
graduate = { version = "1.0.0", path = "../graduate" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.20"
thiserror.workspace = true
tachyonfx = { version = "0.25.1", default-features = false, features = ["sendable", "std-duration"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url.workspace = true
webbrowser = { version = "1.2", features = ["hardened"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[target.'cfg(windows)'.dependencies]
atomicwrites = "0.4"

[lints]
workspace = true
