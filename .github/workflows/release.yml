name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --package graduate-cli

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          artifact="graduate-${{ matrix.target }}"
          mkdir -p "dist/$artifact"
          cp "target/${{ matrix.target }}/release/gd" "dist/$artifact/"
          cp LICENSE README.md CHANGELOG.md "dist/$artifact/"
          test -x "dist/$artifact/gd"
          tar -czf "dist/$artifact.tar.gz" -C dist "$artifact"
          (cd dist && shasum -a 256 "$artifact.tar.gz" > "$artifact.tar.gz.sha256")

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $artifact = "graduate-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$artifact"
          Copy-Item "target/${{ matrix.target }}/release/gd.exe" "dist/$artifact/"
          Copy-Item LICENSE, README.md, CHANGELOG.md "dist/$artifact/"
          if (!(Test-Path "dist/$artifact/gd.exe")) { throw "missing release binary" }
          Compress-Archive -Path "dist/$artifact" -DestinationPath "dist/$artifact.zip"
          $hash = (Get-FileHash "dist/$artifact.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $artifact.zip" | Out-File -Encoding ascii "dist/$artifact.zip.sha256"

      - name: Attest artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/graduate-${{ matrix.target }}.${{ matrix.archive }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graduate-${{ matrix.target }}
          path: |
            dist/graduate-${{ matrix.target }}.${{ matrix.archive }}
            dist/graduate-${{ matrix.target }}.${{ matrix.archive }}.sha256

  release:
    name: Publish GitHub release
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: graduate-*
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}" artifacts/*

  npm:
    name: Publish npm bootstrap package
    needs: [plan, release]
    if: ${{ needs.plan.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify tag and package versions match
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./npm/package.json').version")"
      - name: Publish with npm Trusted Publishing
        working-directory: npm
        run: npm publish --access public

  homebrew:
    name: Update Homebrew tap
    needs: [plan, release]
    if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' && needs.plan.outputs.prerelease == 'false' }}
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
      tap_repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
