name: Generate Skills

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/graduate-cli/Cargo.toml"
      - "crates/graduate-cli/src/cli.rs"
      - "crates/graduate-cli/src/generate_skills.rs"
      - ".github/workflows/generate-skills.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-skills-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  generate:
    name: Generate and publish skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || 'main' }}
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Generate repository-controlled skills
        run: cargo run --locked -- generate-skills --force
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: .github/workflows/generate-skills.yml
      - name: Validate generated skills
        run: |
          failed=0
          for skill_dir in skills/*/; do
            if ! uvx --from skills-ref@0.1.1 agentskills validate "$skill_dir"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Check for changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- skills/ docs/skills.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update main synchronization PR
        if: >-
          steps.diff.outputs.changed == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          branch: chore/sync-agent-skills
          title: "chore: sync generated agent skills"
          body: |
            Synchronize Graduate's generated Agent Skills with the current CLI contract.

            Created by the **Generate Skills** workflow.
          commit-message: "chore: regenerate agent skills"
          add-paths: |
            skills/
            docs/skills.md
          delete-branch: true
      - name: Commit branch skill changes directly
        if: steps.diff.outputs.changed == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "graduate-release-bot"
          git config user.email "graduate-release-bot@users.noreply.github.com"
          git add skills/graduate docs/skills.md
          git commit -m "chore: regenerate local agent skills"
          git push
